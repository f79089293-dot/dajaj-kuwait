plugins = []
headers = [
  # 🚫 لوحة التحكم: no-store نهائي — لحظية الأحداث (موافقة/رفض) لا تتأثر بالكاش
  { for = "/admin/*", values = { Cache-Control = "no-store, no-cache, must-revalidate", Pragma = "no-cache", Expires = "0" } },
  { for = "/admin", values = { Cache-Control = "no-store, no-cache, must-revalidate" } },
  # صفحات HTML للموقع: تتحقق من التحديث دائماً
  { for = "/*", values = { X-Frame-Options = "SAMEORIGIN" } },
]
redirects = []

[functions]

  [functions."*"]

[build]
publish = "."
publishOrigin = "default"
# توليد صفحات المنتجات الثابتة (product/, prices.html, feed.xml, sitemap.xml)
# من products-snapshot.json عند كل نشر. لا يحتاج شبكة؛ وعند أي فشل نُكمل بالنشر
# بالملفات المُلتزَمة مسبقاً (|| true) حتى لا يفشل النشر أبداً.
command = "python3 build_static.py || true"

